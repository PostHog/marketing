name: Banger Bot

# Banger Bot posts to #team-editorial when a post on X from the PostHog brand
# account, or from an affiliated employee account, passes a like milestone.
# Each message carries an image of the post with a meme overlay for the tier.
#
# The account list and the milestones are in bots/banger-bot/config.json.
# The bot code is in bots/banger-bot/. Read bots/banger-bot/README.md first.
#
# The bot reads the like counts from Octolens, which PostHog already pays for.
# It needs no X API subscription. Octolens collects by keyword, so it does not
# hold every post from these accounts. Read the coverage section of the README.
#
# SETUP:
# 1. Add these repository secrets (Settings → Secrets and variables → Actions):
#      - OCTOLENS_API_KEY   An Octolens API key with the read scope.
#      - BANGER_BOT_SLACK_TOKEN       A Slack bot token with files:write and
#                                     chat:write.
#      - BANGER_BOT_SLACK_CHANNEL_ID  The id of #team-editorial.
#      - ANTHROPIC_API_KEY  Runs the gut check. Without it the bot screens a
#                           post against the phrase list only.
# 2. Invite the Slack app to the channel, or the upload fails with
#    not_in_channel.
# 3. Test it: Actions tab → "Banger Bot" → Run workflow → set dry_run to true.
#    A dry run draws the images and posts nothing. Download them from the
#    "banger-bot-preview" artifact on the run.
#
# The bot keeps its state in the Actions cache. A cache miss is safe. The bot
# then records the current like counts, and it posts nothing for that run.

permissions:
    contents: read

on:
    schedule:
        - cron: '23 */2 * * *'
    workflow_dispatch:
        inputs:
            dry_run:
                description: Draw the images and post nothing
                type: boolean
                default: false

concurrency:
    group: banger-bot
    cancel-in-progress: false

jobs:
    check-bangers:
        runs-on: ubuntu-latest
        env:
            BANGER_BOT_IMAGE_DIR: banger-bot-preview
        steps:
            - name: Check out the repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Set up Node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 22

            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: '3.12'

            - name: Install Pillow
              run: python3 -m pip install --quiet 'pillow==11.*'

            - name: Install the Node dependencies
              run: npm ci
              working-directory: bots/banger-bot

            - name: Run the unit tests
              run: node --test bots/banger-bot/test/*.test.js

            # Draws one image for each milestone. This catches a missing asset,
            # a missing font, and a broken layout before the bot posts anything.
            - name: Check the renderer
              run: python3 bots/banger-bot/render/banger_image.py --samples "$RUNNER_TEMP/samples"

            # The state records the milestones that the bot announced before.
            # The key holds the run id, so every run writes a new cache entry.
            # The restore key then finds the most recent entry.
            - name: Restore the bot state
              uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: .banger-bot-state
                  key: banger-bot-state-${{ github.run_id }}
                  restore-keys: banger-bot-state-

            - name: Check for bangers
              run: node bots/banger-bot/src/index.js
              env:
                  OCTOLENS_API_KEY: ${{ secrets.OCTOLENS_API_KEY }}
                  BANGER_BOT_SLACK_TOKEN: ${{ secrets.BANGER_BOT_SLACK_TOKEN }}
                  BANGER_BOT_SLACK_CHANNEL_ID: ${{ secrets.BANGER_BOT_SLACK_CHANNEL_ID }}
                  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
                  DRY_RUN: ${{ inputs.dry_run }}

            - name: Upload the dry run images
              if: ${{ inputs.dry_run }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: banger-bot-preview
                  path: banger-bot-preview
                  if-no-files-found: ignore

            # Save the state even after a failure. The bot writes the file only
            # after it posts, so a saved file never holds an unsent milestone.
            - name: Save the bot state
              if: always()
              uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: .banger-bot-state
                  key: banger-bot-state-${{ github.run_id }}
