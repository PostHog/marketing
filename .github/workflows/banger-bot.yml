name: Banger Bot

# Banger Bot posts to #team-editorial when a tweet from the PostHog brand
# account, or from an affiliated employee account, passes a like milestone.
#
# The account list and the milestones are in bots/banger-bot/config.json.
# The bot code is in bots/banger-bot/. Read bots/banger-bot/README.md first.
#
# SETUP:
# 1. Add these repository secrets (Settings → Secrets and variables → Actions):
#      - X_BEARER_TOKEN                 A bearer token for the X API v2.
#      - SLACK_WEBHOOK_TEAM_EDITORIAL   An incoming webhook for #team-editorial.
# 2. The X API charges for reads. Check the quota notes in the README before you
#    make the schedule below more frequent.
# 3. Test it: Actions tab → "Banger Bot" → Run workflow → set dry_run to true.
#    A dry run prints the Slack payload in the job log. It posts nothing.
#
# The bot keeps its state in the Actions cache. A cache miss is safe. The bot
# then records the current like counts, and it posts nothing for that run.

permissions:
    contents: read

on:
    schedule:
        - cron: '23 */2 * * *'
    workflow_dispatch:
        inputs:
            dry_run:
                description: Print the Slack payload in the log instead of posting it
                type: boolean
                default: false

concurrency:
    group: banger-bot
    cancel-in-progress: false

jobs:
    check-bangers:
        runs-on: ubuntu-latest
        steps:
            - name: Check out the repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Set up Node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
              with:
                  node-version: 22

            - name: Run the unit tests
              run: node --test bots/banger-bot/test/*.test.js

            # The state records the milestones that the bot announced before.
            # The key holds the run id, so every run writes a new cache entry.
            # The restore key then finds the most recent entry.
            - name: Restore the bot state
              uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: .banger-bot-state
                  key: banger-bot-state-${{ github.run_id }}
                  restore-keys: banger-bot-state-

            - name: Check for bangers
              run: node bots/banger-bot/src/index.js
              env:
                  X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
                  SLACK_WEBHOOK_TEAM_EDITORIAL: ${{ secrets.SLACK_WEBHOOK_TEAM_EDITORIAL }}
                  DRY_RUN: ${{ inputs.dry_run }}

            # Save the state even after a failure. The bot writes the file only
            # after it posts, so a saved file never holds an unsent milestone.
            - name: Save the bot state
              if: always()
              uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
              with:
                  path: .banger-bot-state
                  key: banger-bot-state-${{ github.run_id }}
