name: Sync artist labels from board

# Syncs per-artist labels on issues tracked by the "Art & Brand Planning" board
# (https://github.com/orgs/PostHog/projects/65).
#
# Every 30 minutes: any open issue whose board Status is "Assigned: <artist>"
# gets the matching "<artist>" label; if the status changes to something else,
# the label is removed. Closed issues are left untouched.
#
# The board is org-level, so this runs once from this repo and labels board items
# wherever they live (this repo, PostHog/posthog.com, etc.) — it does not need a
# copy per repo.
#
# SETUP:
# 1. Each repo with issues on the board needs a label for every artist in the
#    statusToLabel map below (Issues → Labels). They already exist in this repo.
# 2. This uses the posthog-art-board-bot GitHub App. Its credentials must be
#    available to this repo as secrets:
#      - GH_APP_POSTHOG_ART_BOARD_BOT_APP_ID
#      - GH_APP_POSTHOG_ART_BOARD_BOT_PRIVATE_KEY
#    The app installation needs:
#      - Repository permissions: Issues → Read and write (every repo with board issues)
#      - Organization permissions: Projects → Read-only
# 3. Test it: Actions tab → "Sync artist labels from board" → Run workflow.

permissions:
    contents: read

on:
    schedule:
        - cron: '*/30 * * * *'
    workflow_dispatch:

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - name: Get app token
              id: app-token
              uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
              with:
                  app-id: ${{ secrets.GH_APP_POSTHOG_ART_BOARD_BOT_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTHOG_ART_BOARD_BOT_PRIVATE_KEY }}
                  # Board items live in other repos too (art requests started out
                  # in PostHog/posthog.com) — an unscoped token only covers this
                  # repo and 403s on every cross-repo write.
                  owner: PostHog
                  repositories: |
                      posthog.com
                      marketing
            - name: Sync labels with board status
              uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
              with:
                  github-token: ${{ steps.app-token.outputs.token }}
                  script: |
                      const org = "PostHog";
                      const projectNumber = 65;
                      const statusToLabel = {
                        "Assigned: Lottie": "Lottie",
                        "Assigned: Heidi": "Heidi",
                        "Assigned: Daniel": "Daniel",
                      };
                      const managedLabels = Object.values(statusToLabel);

                      let cursor = null;
                      const changes = [];
                      while (true) {
                        const res = await github.graphql(`
                          query($org: String!, $num: Int!, $cursor: String) {
                            organization(login: $org) {
                              projectV2(number: $num) {
                                items(first: 100, after: $cursor) {
                                  pageInfo { hasNextPage endCursor }
                                  nodes {
                                    fieldValueByName(name: "Status") {
                                      ... on ProjectV2ItemFieldSingleSelectValue { name }
                                    }
                                    content {
                                      ... on Issue {
                                        number
                                        state
                                        repository { name owner { login } }
                                        labels(first: 50) { nodes { name } }
                                      }
                                    }
                                  }
                                }
                              }
                            }
                          }`, { org, num: projectNumber, cursor });

                        const items = res.organization.projectV2.items;
                        for (const n of items.nodes) {
                          const status = n.fieldValueByName && n.fieldValueByName.name;
                          const c = n.content;
                          if (!c || !c.number) continue;
                          if (c.state !== "OPEN") continue;
                          const wanted = statusToLabel[status] || null;
                          const have = c.labels.nodes.map(l => l.name).filter(name => managedLabels.includes(name));
                          if (wanted && !have.includes(wanted)) {
                            changes.push({ action: "add", owner: c.repository.owner.login, repo: c.repository.name, number: c.number, label: wanted });
                          }
                          for (const name of have) {
                            if (name !== wanted) {
                              changes.push({ action: "remove", owner: c.repository.owner.login, repo: c.repository.name, number: c.number, label: name });
                            }
                          }
                        }
                        if (!items.pageInfo.hasNextPage) break;
                        cursor = items.pageInfo.endCursor;
                      }

                      // One inaccessible issue (e.g. in a repo the token isn't
                      // scoped for) must not kill the rest of the sync.
                      let failures = 0;
                      for (const t of changes) {
                        try {
                          if (t.action === "add") {
                            await github.rest.issues.addLabels({ owner: t.owner, repo: t.repo, issue_number: t.number, labels: [t.label] });
                          } else {
                            await github.rest.issues.removeLabel({ owner: t.owner, repo: t.repo, issue_number: t.number, name: t.label });
                          }
                        } catch (error) {
                          failures++;
                          core.info(`Skipped ${t.owner}/${t.repo}#${t.number}: ${error.message}`);
                        }
                      }
                      core.info(`Applied ${changes.length - failures} of ${changes.length} label change(s).`);
                      if (failures > 0) core.warning(`${failures} change(s) could not be applied.`);
